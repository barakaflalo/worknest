<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>WorkNest — מעקב שעות העבודה שלי</title>
<meta name="description" content="WorkNest: מעקב שעות, משמרות ושכר. בלי פרסומות, הכול נשמר במכשיר.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="WorkNest">
<meta property="og:description" content="מעקב שעות העבודה שלי, בלי פרסומות">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--acc:#D4AF37;--acc2:#F1DC94;--bg:#000;--sf:#0d0d0d;--sf2:#161616;--ln:#2b2a26;--tx:#f3efe4;--mut:#958f80;--dng:#e0675f;--ok:#62c18e;
--f:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--fd:'Frank Ruhl Libre',Georgia,'Times New Roman',serif;--ease:cubic-bezier(.2,.7,.2,1)}
[data-mode="day"]{--bg:#f1f1ee;--sf:#ffffff;--sf2:#e8e7e2;--ln:#d3d0c7;--tx:#171717;--mut:#66625a}
[data-theme="gold"]{--acc:#D4AF37;--acc2:#F1DC94}
[data-theme="silver"]{--acc:#C3CBD3;--acc2:#EEF2F6}
[data-theme="copper"]{--acc:#CF7F4F;--acc2:#F2B792}
[data-theme="emerald"]{--acc:#3FB68B;--acc2:#A1E4C9}
[data-theme="sapphire"]{--acc:#6F98F0;--acc2:#BACFFA}
[data-mode="day"][data-theme="gold"]{--acc:#8A6A10;--acc2:#C29A2E}
[data-mode="day"][data-theme="silver"]{--acc:#4B5763;--acc2:#8593A1}
[data-mode="day"][data-theme="copper"]{--acc:#974B1F;--acc2:#C9794A}
[data-mode="day"][data-theme="emerald"]{--acc:#1B7554;--acc2:#3DA67D}
[data-mode="day"][data-theme="sapphire"]{--acc:#2853B3;--acc2:#5C84D8}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{color-scheme:dark}[data-mode="day"]{color-scheme:light}
html{height:100%;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:17px/1.5 var(--f);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.skip{position:absolute;inset-inline-start:-999px;top:0;background:var(--acc);color:#000;padding:8px 12px;z-index:99}
.skip:focus{inset-inline-start:8px}
.app{max-width:560px;margin:0 auto;padding:0 16px 96px;min-height:100vh}
.screen{display:none}
.screen.on{display:block;animation:in .22s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* top bars */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 6px}
.bar{display:flex;align-items:center;gap:12px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.bar h1{margin:0;font:500 24px/1.2 var(--fd);flex:1}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 16px;border:1.5px solid var(--acc);border-radius:999px;background:transparent;font-weight:700;color:var(--acc)}
.backbtn svg{width:18px;height:18px}
[dir="rtl"] .backbtn svg{transform:scaleX(-1)}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);display:inline-grid;place-items:center;color:var(--tx)}
.ib svg{width:22px;height:22px}
.topacts{display:flex;gap:8px}
.jobchip{display:inline-flex;align-items:center;gap:10px;min-height:46px;max-width:65%;padding:0 16px;border:1px solid var(--ln);background:var(--sf);border-radius:999px;font-weight:700}
.jobchip span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobchip svg{width:16px;height:16px;flex:none;color:var(--mut)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.brand{font:500 15px var(--fd);color:var(--mut);text-align:center;margin:2px 0 0;letter-spacing:.02em}
.brand b{color:var(--acc);font-weight:500}
/* dial */
.dialwrap{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:12px auto 4px}
#dial{width:100%;height:100%;display:block;overflow:visible}
.dialc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 18%}
.dlbl{font-size:15px;color:var(--mut);font-weight:600}
.dlbl.live{color:var(--acc)}
.dbig{font:300 clamp(46px,15vw,64px)/1.05 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.01em;direction:ltr}
.dsub{font-size:15px;color:var(--mut);min-height:22px}
.dsub b{color:var(--tx)}
.tick{stroke:var(--ln)}
.tick.big{stroke:var(--mut)}
.ring{fill:none;stroke:var(--ln);stroke-width:1}
.arc{fill:none;stroke-linecap:round;stroke-width:9}
.arc.b{stroke:var(--acc)}
.arc.o{stroke:var(--acc2)}
.hand{fill:var(--acc)}
.num{fill:var(--mut);font:300 15px var(--fd);text-anchor:middle;dominant-baseline:central}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:700;font-size:17px;width:100%}
.btn.pri{background:var(--acc);color:#000}
[data-mode="day"] .btn.pri{color:#fff}
.btn.big{min-height:64px;font-size:20px;border-radius:18px}
.btn.dng{border-color:var(--dng);color:var(--dng)}
.btn.ghost{border-color:var(--ln);color:var(--tx)}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px}
.punch{display:grid;gap:10px;margin:14px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{border:1px solid var(--ln);border-radius:14px;padding:12px 14px;background:var(--sf)}
.stat small{display:block;color:var(--mut);font-size:14px}
.stat .v{font:500 22px/1.2 var(--fd);font-variant-numeric:tabular-nums}
.stat .v2{color:var(--acc);font-weight:700;font-size:15px}
.homenav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:84px;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--sf);text-align:start;font-weight:700}
.navbtn svg{width:24px;height:24px;color:var(--acc)}
.badge{margin:28px 0 8px;text-align:center;color:var(--mut);font-size:13px}
.badge a{color:var(--acc);text-decoration:none}
/* banners */
.banner{border:1px solid var(--acc);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--sf)}
.banner.warn{border-color:var(--dng)}
.banner p{margin:0 0 10px}
/* period header */
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.phead .lbl{font:500 20px var(--fd);text-align:center;flex:1}
/* shift list */
.list{display:grid;gap:8px}
.shift{border:1px solid var(--ln);border-radius:14px;background:var(--sf);overflow:hidden}
.shift>button{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px 12px 12px;border:0;background:transparent;text-align:start}
.shift .stripe{align-self:stretch;border-radius:4px}
.shift .d{font-weight:700}
.shift .t{color:var(--mut);font-size:15px;direction:ltr;unicode-bidi:isolate}
.shift .p{text-align:end;font-variant-numeric:tabular-nums}
.shift .p b{display:block;font:500 18px var(--fd)}
.shift .p span{color:var(--mut);font-size:14px}
.shift .more{padding:0 14px 14px;border-top:1px dashed var(--ln);display:none}
.shift.open .more{display:block}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px}
.kv span:first-child{color:var(--mut)}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:999px;border:1px solid var(--ln);color:var(--mut);margin-inline-start:6px;font-weight:600}
.empty{text-align:center;padding:40px 14px;color:var(--mut)}
.empty b{display:block;color:var(--tx);font:500 20px var(--fd);margin-bottom:6px}
.sumbar{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--acc);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.sumbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;text-align:center}
.sumbar small{display:block;color:var(--mut);font-size:13px}
.sumbar b{font:500 18px var(--fd);font-variant-numeric:tabular-nums}
.sumbar .tot b{color:var(--acc)}
.sumdetail{border:1px solid var(--ln);border-radius:14px;padding:6px 14px;margin:14px 0;background:var(--sf)}
/* forms */
.card{border:1px solid var(--ln);border-radius:16px;padding:4px 14px;margin:0 0 14px;background:var(--sf)}
.card h2{font:500 18px var(--fd);margin:12px 0 4px;color:var(--acc)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.fld:last-child{border-bottom:0}
.fld label,.fld .lb{flex:1;font-weight:600}
.fld small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.fld input[type=number],.fld input[type=text],.fld input[type=time],.fld input[type=date],.fld select{width:130px;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--sf2);text-align:center}
.fld input[type=time],.fld input[type=date]{width:158px}
.fld input[type=text].wide{width:100%}
.fld.col{flex-direction:column;align-items:stretch}
.fld textarea{width:100%;min-height:64px;border-radius:10px;border:1px solid var(--ln);background:var(--sf2);padding:8px 10px}
input[type=number]{direction:ltr}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;pointer-events:none;border-radius:999px;background:var(--sf2);border:1px solid var(--ln);transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.2s}
.sw input:checked+span{background:var(--acc);border-color:var(--acc)}
.sw input:checked+span::after{background:#fff;inset-inline-start:25px}
.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.seg button{flex:1 1 auto;min-height:42px;padding:0 12px;border-radius:999px;border:1px solid var(--ln);background:var(--sf2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#000}
[data-mode="day"] .seg button[aria-pressed="true"]{color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:10px 0}
.swatches button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--tx);box-shadow:0 0 0 2px var(--bg) inset}
.tblock{border:1px solid var(--ln);border-radius:12px;margin:10px 0;overflow:hidden}
.tblock summary{list-style:none;padding:12px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer}
.tblock summary::-webkit-details-marker{display:none}
.tblock summary::after{content:"+";margin-inline-start:auto;color:var(--acc);font-size:22px;line-height:1}
.tblock[open] summary::after{content:"−"}
.tblock .body{padding:0 12px 6px}
.note{color:var(--mut);font-size:14px;margin:6px 0 10px}
.preview{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border:1px solid var(--acc);border-radius:14px;padding:12px 14px;margin:0 0 14px;background:var(--sf)}
.preview b{font:500 24px var(--fd);color:var(--acc)}
.stack{display:grid;gap:10px;margin:0 0 14px}
.jobcard{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);text-align:start}
.jobcard .n{font-weight:700;flex:1}
.jobcard small{display:block;color:var(--mut)}
.jobcard.act{border-color:var(--acc)}
.linkrow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 4px;border:0;border-bottom:1px solid var(--ln);background:transparent;text-align:start;font-weight:600;text-decoration:none;color:var(--tx)}
.linkrow:last-child{border-bottom:0}
.linkrow svg{width:20px;height:20px;color:var(--acc);flex:none}
.linkrow.dng{color:var(--dng)}
.linkrow.dng svg{color:var(--dng)}
.saved{font-size:13px;color:var(--mut);text-align:center;margin:0 0 10px}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.sheet{width:100%;max-width:520px;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px;max-height:85vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px);animation:in .2s var(--ease)}
.sheet h2{margin:0 0 10px;font:500 21px var(--fd)}
.sheet p{margin:0 0 14px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;z-index:60;width:max-content;max-width:calc(100% - 32px);font-weight:600}
.toast button{background:transparent;border:0;color:var(--bg);font-weight:800;text-decoration:underline;min-height:36px;padding:0 6px}
.ob{text-align:center;padding:10px 4px}
.ob svg{width:72px;height:72px;color:var(--acc)}
.ob h2{font:500 26px var(--fd);margin:12px 0 8px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ln)}
.dots i.on{background:var(--acc)}
pre.diag{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--sf2);padding:10px;border-radius:10px;direction:ltr;text-align:left;max-height:220px;overflow:auto}
.dgrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:15px}
.dgrow span:last-child{color:var(--mut);text-align:end;direction:ltr;unicode-bidi:isolate}
.aboutlogo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 18px}
.aboutlogo img{width:84px;height:84px;border-radius:22px}
.aboutlogo b{font:500 28px var(--fd)}
.disc{font-size:14px;color:var(--mut);border-inline-start:3px solid var(--acc);padding:4px 12px;margin:14px 0}
#printRoot{display:none}
.navbtn.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:60px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .bar{fill:var(--acc)}.chart .bar.dim{fill:var(--ln)}.chart .bar.o{fill:var(--acc2)}
.chart text{fill:var(--mut);font:12px var(--f)}.chart text.v{fill:var(--tx);font-weight:700}
.chart line{stroke:var(--ln)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.stat small.up{color:var(--ok)}.stat small.down{color:var(--dng)}
h1[tabindex="-1"]:focus{outline:none}
.kv span:last-child{direction:ltr;unicode-bidi:isolate}
.hbar{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.hbar i{display:block;height:10px;border-radius:6px;background:var(--acc);min-width:2px}
.jobrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.jobrow:last-child{border-bottom:0}
.jobrow .n{flex:1;font-weight:700}.jobrow b{font:500 17px var(--fd)}
.net{color:var(--acc)}

.linkbtn{background:transparent;border:0;color:var(--acc);font-weight:700;text-decoration:underline;min-height:44px;padding:0 8px;margin:0 auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
.chips button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-weight:700}
.tpl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.tpl .n{flex:1;font-weight:700}.tpl small{display:block;color:var(--mut);font-weight:400}
.tpladd{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0}
.tpladd input{min-height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--sf2);padding:6px 10px;text-align:center;width:100%}
.tpladd .full{grid-column:1/-1}
.tpladd label{font-size:13px;color:var(--mut);display:grid;gap:4px}
@media print{
 @page{size:A4;margin:14mm}
 html,body{background:#fff!important;color:#000!important}
 .app,#modalRoot,#toastRoot,#fileWarn,.sumbar,.skip{display:none!important}
 #printRoot{display:block!important;font:11pt/1.45 var(--f);color:#000}
}
#printRoot h1{font:500 22pt var(--fd);margin:0 0 2pt}
#printRoot .meta{display:grid;grid-template-columns:auto 1fr;gap:2pt 14pt;margin:10pt 0 12pt;font-size:10.5pt}
#printRoot .meta span:nth-child(odd){color:#555}
#printRoot table{width:100%;border-collapse:collapse;font-size:10pt}
#printRoot th{text-align:start;border-bottom:1.5pt solid #8A6A10;padding:4pt 5pt;font-weight:700}
#printRoot td{border-bottom:.5pt solid #ccc;padding:4pt 5pt;font-variant-numeric:tabular-nums}
#printRoot td.n,#printRoot th.n{text-align:end}
#printRoot .sum{margin:12pt 0 0 auto;width:60%;font-size:10.5pt}
#printRoot .sum div{display:flex;justify-content:space-between;padding:2pt 0;border-bottom:.5pt solid #ddd}
#printRoot .sum .t{font-weight:700;border-bottom:1.5pt solid #8A6A10;font-size:12pt}
#printRoot .foot{margin-top:18pt;font-size:8.5pt;color:#555}
</style>
</head>

 <defs>

/* ---------- storage shim (Part B.7) ---------- */
const store=(()=>{let ok=false;const mem={};try{localStorage.setItem('__wn','1');localStorage.removeItem('__wn');ok=true}catch(e){}
 return{ok:()=>ok,get(k){try{return ok?localStorage.getItem(k):(k in mem?mem[k]:null)}catch(e){return k in mem?mem[k]:null}},
 set(k,v){if(ok)localStorage.setItem(k,v);else mem[k]=v},del(k){try{ok?localStorage.removeItem(k):delete mem[k]}catch(e){}}}})();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const num=(v,d=0)=>{const n=parseFloat(v);return isFinite(n)?n:d};
const pad=n=>String(n).padStart(2,'0');
const hm=s=>{const[a,b]=String(s||'0:0').split(':');return(+a||0)*60+(+b||0)};
function atTime(y,m,d,str){const x=hm(str);return new Date(y,m,d,Math.floor(x/60),x%60).getTime()}
function dayParts(ms){const d=new Date(ms);return[d.getFullYear(),d.getMonth(),d.getDate()]}
function isoDate(ms){const[y,m,d]=dayParts(ms);return y+'-'+pad(m+1)+'-'+pad(d)}
function hhmm(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())}
function ovl(a1,a2,b1,b2){return Math.max(0,Math.min(a2,b2)-Math.max(a1,b1))}
function fmtH(min){min=Math.max(0,Math.round(min));return Math.floor(min/60)+':'+pad(min%60)}
function locale(){return({he:'he-IL',en:'en-GB',ru:'ru-RU',es:'es-ES',ar:'ar-EG'})[S.lang]||'he-IL'}
function money(n){n=+n||0;return '₪'+n.toLocaleString(locale().replace('ar-EG','ar-IL-u-nu-latn'),{minimumFractionDigits:Number.isInteger(r2(n))?0:2,maximumFractionDigits:2})}
function fmtDay(ms,opt){return new Intl.DateTimeFormat(locale().replace('ar-EG','ar-u-nu-latn'),opt).format(new Date(ms))}
function wdName(i,style){const d=new Date(2024,0,7+i);return fmtDay(d.getTime(),{weekday:style||'long'})}

/* ---------- i18n ---------- */
function T(k,vars){const a=STR[k];if(!a)return k;let s=a[LANGS.indexOf(S.lang)]||a[1]||k;if(vars)for(const v in vars)s=s.split('{'+v+'}').join(vars[v]);return s}

/* ---------- state ---------- */
function defTypes(){return{
 morning:{base:8,h1:2,p0:100,p1:125,p2:150},
 afternoon:{base:8,h1:2,p0:100,p1:125,p2:150,start:'15:00'},
 night:{base:7,h1:2,p0:100,p1:125,p2:150,from:'22:00',to:'06:00'},
 shabbat:{base:8,h1:2,p0:150,p1:175,p2:200,fromDay:5,from:'16:00',toDay:6,to:'20:00'}}}
function newJob(name){return{id:uid(),name:name||T('defaultJob'),color:'#D4AF37',wage:50,dayPayAuto:true,dayPay:400,fixedAdd:0,fixedDed:0,
 breakMin:0,breakAfter:6,travel:0,overtime:true,periodStart:1,autoHolidays:true,templates:[],net:{on:true,points:2.25,pension:6,study:0},types:defTypes(),absence:{holiday:100,vacation:100,sick:100,reserve:100}}}
/* Israeli payroll rates 2026 (tax brackets widened Mar-2026 retroactive to Jan; NI reduced band 7,703; ceiling 51,910). Editable in Settings. */
function defTax(){return{year:2026,point:242,br:[[7010,10],[10060,14],[19000,20],[25100,31],[46690,35],[60130,47]],top:50,niLow:7703,niLowRate:4.27,niHighRate:12.17,niMax:51910,penCap:9700,penRate:35}}
function defState(){const guess=(navigator.language||'he').slice(0,2);const lang=LANGS.includes(guess)?guess:'he';
 const s={v:1,lang,theme:'gold',mode:'night',notif:false,tax:defTax(),lastNfc:0,user:'',onboarded:false,lastBackup:0,jobs:[],cur:null,active:null,shifts:[]};return s}
let S=defState();
function migrate(o){const d=defState();const s=Object.assign(d,o||{});
 if(!Array.isArray(s.jobs))s.jobs=[];if(!Array.isArray(s.shifts))s.shifts=[];
 s.jobs=s.jobs.map(j=>{const n=newJob(j.name);const m=Object.assign(n,j);m.types=Object.assign(defTypes(),j.types||{});
  for(const k in m.types)m.types[k]=Object.assign(defTypes()[k],(j.types||{})[k]||{});m.absence=Object.assign(n.absence,j.absence||{});m.net=Object.assign(n.net,j.net||{});if(!Array.isArray(m.templates))m.templates=[];return m});
 s.tax=Object.assign(defTax(),s.tax||{});if(!Array.isArray(s.tax.br)||!s.tax.br.length)s.tax.br=defTax().br;
 if(!['day','night'].includes(s.mode))s.mode='night';
 if(!['gold','silver','copper','emerald','sapphire'].includes(s.theme))s.theme='gold';
 if(!LANGS.includes(s.lang))s.lang='he';
 return s}
function load(){try{const raw=store.get(SKEY);if(raw)S=migrate(JSON.parse(raw))}catch(e){logErr('load: '+e.message)}fixup()}
function fixup(){if(!S.jobs.length){S.jobs.push(newJob());}
 if(!S.jobs.find(j=>j.id===S.cur))S.cur=S.jobs[0].id;
 purgeBin()}
let persistAsked=false;
function save(){try{store.set(SKEY,JSON.stringify(S))}catch(e){logErr('save: '+e.message);toast(T('saveFail'));return false}
 if(!persistAsked&&navigator.storage&&navigator.storage.persist){persistAsked=true;navigator.storage.persist().catch(()=>{})}
 return true}
function job(id){return S.jobs.find(j=>j.id===(id||S.cur))||S.jobs[0]}
function purgeBin(){const lim=Date.now()-30*DAY_MS;S.shifts=S.shifts.filter(s=>!s.deleted||s.deleted>lim)}

/* ---------- calculation engine ---------- */
function dayPay(j){return j.dayPayAuto?r2(j.wage*j.types.morning.base):num(j.dayPay)}
/* Israeli rest-day holidays via the browser's Hebrew calendar (Intl, no data files) */
let HEBF=null;const hebCache={};
function hebDate(y,m,d){const k=y+'-'+m+'-'+d;if(hebCache[k])return hebCache[k];
 try{if(!HEBF)HEBF=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long'});const p=HEBF.formatToParts(new Date(y,m,d,12));
  const r={day:+(p.find(x=>x.type==='day')||{}).value,month:String((p.find(x=>x.type==='month')||{}).value||'')};return hebCache[k]=r}catch(e){return hebCache[k]={day:0,month:''}}}
function isHoliday(y,m,d){const h=hebDate(y,m,d);const mo=h.month,dd=h.day;
 if(mo==='Tishri')return[1,2,10,15,22].includes(dd);
 if(mo==='Nisan')return dd===15||dd===21;
 if(mo==='Sivan')return dd===6;
 if(mo==='Iyar'&&dd>=3&&dd<=6){const w5=new Date(y,m,d+(5-dd)).getDay();const off=w5===5?4:w5===6?3:w5===1?6:5;return dd===off}
 return false}
function specialOverlap(a,b,j){const t=j.types.shabbat;const iv=[];const[y,m,d]=dayParts(a);
 for(let i=-7;;i++){const dd=new Date(y,m,d+i);if(dd.getTime()>b+DAY_MS)break;const Y=dd.getFullYear(),M=dd.getMonth(),D=dd.getDate();
  if(dd.getDay()===+t.fromDay){const span=((+t.toDay-+t.fromDay)+7)%7;const ws=atTime(Y,M,D,t.from),we=atTime(Y,M,D+span,t.to);if(we>ws)iv.push([ws,we])}
  if(j.autoHolidays!==false&&i>=-2&&isHoliday(Y,M,D)){const ws=atTime(Y,M,D-1,t.from),we=atTime(Y,M,D,t.to);if(we>ws)iv.push([ws,we])}}
 iv.sort((p,q)=>p[0]-q[0]);let sum=0,cs=null,ce=null;
 for(const[s,e]of iv){if(cs===null){cs=s;ce=e}else if(s<=ce){ce=Math.max(ce,e)}else{sum+=ovl(a,b,cs,ce);cs=s;ce=e}}
 if(cs!==null)sum+=ovl(a,b,cs,ce);return sum}
function nightOverlap(a,b,t){let sum=0;const[y,m,d]=dayParts(a);const cross=hm(t.to)<=hm(t.from);
 for(let i=-1;;i++){const dd=new Date(y,m,d+i);if(dd.getTime()>b)break;
  const ws=atTime(dd.getFullYear(),dd.getMonth(),dd.getDate(),t.from);
  const we=atTime(dd.getFullYear(),dd.getMonth(),dd.getDate()+(cross?1:0),t.to);
  sum+=ovl(a,b,ws,we)}return sum}
function classify(a,b,j){const t=j.types,dur=b-a;if(dur<=0)return'morning';
 const so=specialOverlap(a,b,j);if(so>0&&so>=dur/2)return'shabbat';
 if(nightOverlap(a,b,t.night)>=120*60000)return'night';
 const d=new Date(a);if(d.getHours()*60+d.getMinutes()>=hm(t.afternoon.start))return'afternoon';
 return'morning'}
function calc(s,j){j=j||job(s.jobId);const r={min:0,tiers:[],pay:0,base:0,type:null,breakDed:0,travel:0,bonus:num(s.bonus),deduct:num(s.deduct)};
 if(s.kind&&s.kind!=='work'){const pct=num((j.absence||{})[s.kind],100);r.base=r2(dayPay(j)*pct/100);r.pay=r2(r.base+r.bonus-r.deduct);return r}
 const gross=Math.max(0,(s.end-s.start)/60000);const pm=Math.max(0,num(s.pauseMin));let w=Math.max(0,gross-pm);
 if(num(j.breakMin)>0&&w>=num(j.breakAfter)*60){r.breakDed=Math.min(w,Math.max(0,num(j.breakMin)-pm));w-=r.breakDed}
 w=Math.round(w);
 const type=(s.forceType&&s.forceType!=='auto')?s.forceType:classify(s.start,s.end,j);const c=j.types[type];
 let tiers;if(!j.overtime)tiers=[{p:num(c.p0,100),m:w}];else{const b0=num(c.base)*60,b1=num(c.h1)*60;
  tiers=[{p:num(c.p0,100),m:Math.min(w,b0)},{p:num(c.p1,125),m:Math.min(Math.max(w-b0,0),b1)},{p:num(c.p2,150),m:Math.max(w-b0-b1,0)}]}
 r.base=r2(tiers.reduce((x,t)=>x+num(j.wage)*t.m/60*t.p/100,0));
 r.travel=w>0?num(j.travel):0;r.min=w;r.tiers=tiers;r.type=type;
 r.pay=r2(r.base+r.travel+r.bonus-r.deduct);return r}
function periodOf(ms,j){const P=Math.min(28,Math.max(1,Math.round(num(j.periodStart,1))));const d=new Date(ms);
 let y=d.getFullYear(),m=d.getMonth();if(d.getDate()<P){m--;if(m<0){m=11;y--}}return{y,m,P}}
function periodRange(p){return{from:new Date(p.y,p.m,p.P).getTime(),to:new Date(p.y,p.m+1,p.P).getTime()}}
function shiftsIn(from,to,jobId){return S.shifts.filter(s=>!s.deleted&&s.jobId===jobId&&s.start>=from&&s.start<to).sort((a,b)=>a.start-b.start)}
function summary(from,to,j){const list=shiftsIn(from,to,j.id);let min=0,gross=0,travel=0,wn=0;const byType={};list.forEach(s=>{const c=calc(s,j);min+=c.min;gross+=c.pay;travel+=c.travel;if(s.kind==='work'){wn++;byType[c.type]=(byType[c.type]||0)+c.min}});
 const hasAny=list.length>0;const fa=hasAny?num(j.fixedAdd):0,fd=hasAny?num(j.fixedDed):0;
 return{n:list.length,wn,min,gross:r2(gross),travel:r2(travel),byType,fixedAdd:fa,fixedDed:fd,total:r2(gross+fa-fd),list}}
/* net estimate — monthly Israeli payroll approximation */
function bracketTax(x,t){let tax=0,prev=0;for(const[lim,rate]of t.br){const l=num(lim);if(x<=prev)break;tax+=(Math.min(x,l)-prev)*num(rate)/100;prev=l}if(x>prev)tax+=(x-prev)*num(t.top)/100;return tax}
function netOf(gross,travel,j){const t=S.tax,n=j.net||{};gross=Math.max(0,num(gross));const base=Math.max(0,gross-num(travel));
 const pension=base*num(n.pension)/100,study=base*num(n.study)/100;
 const penCredit=Math.min(pension,0.07*Math.min(base,num(t.penCap)))*num(t.penRate)/100;
 const tax=Math.max(0,bracketTax(gross,t)-num(n.points)*num(t.point)-penCredit);
 const lo=Math.min(gross,num(t.niLow)),hi=Math.max(0,Math.min(gross,num(t.niMax))-num(t.niLow));const ni=lo*num(t.niLowRate)/100+hi*num(t.niHighRate)/100;
 return{gross:r2(gross),tax:r2(tax),ni:r2(ni),pension:r2(pension),study:r2(study),net:r2(gross-tax-ni-pension-study)}}
function netLines(sm,j){if(!(j.net&&j.net.on)||!sm.n)return'';const n=netOf(sm.total,sm.travel,j);
 return'<div class="kv"><span>'+esc(T('incomeTax'))+'</span><span>−'+money(n.tax)+'</span></div><div class="kv"><span>'+esc(T('niHealth'))+'</span><span>−'+money(n.ni)+'</span></div>'+
  (n.pension?'<div class="kv"><span>'+esc(T('pension'))+'</span><span>−'+money(n.pension)+'</span></div>':'')+(n.study?'<div class="kv"><span>'+esc(T('study'))+'</span><span>−'+money(n.study)+'</span></div>':'')+
  '<div class="kv net"><span><b>'+esc(T('netEst'))+'</b></span><span><b>'+money(n.net)+'</b></span></div><p class="note">'+esc(T('netDisclaimer'))+'</p>'}

/* ---------- live shift ---------- */
function activeElapsedMs(now){const a=S.active;if(!a)return 0;now=now||Date.now();
 let paused=a.pauses.reduce((x,p)=>x+(p[1]-p[0]),0);if(a.pausedAt)paused+=now-a.pausedAt;return Math.max(0,now-a.start-paused)}
function activePauseMin(now){const a=S.active;if(!a)return 0;now=now||Date.now();let p=a.pauses.reduce((x,q)=>x+(q[1]-q[0]),0);if(a.pausedAt)p+=now-a.pausedAt;return p/60000}
function clockIn(){if(S.active)return;S.active={jobId:S.cur,start:Date.now(),pauses:[],pausedAt:null};save();toast(T('clockedIn',{t:hhmm(S.active.start)}));vib(30);renderHome();syncNotif()}
function clockOut(openEdit){const a=S.active;if(!a)return;const now=Date.now();if(a.pausedAt){a.pauses.push([a.pausedAt,now]);a.pausedAt=null}
 const sh={id:uid(),jobId:a.jobId,kind:'work',start:a.start,end:now,pauseMin:Math.round(a.pauses.reduce((x,p)=>x+(p[1]-p[0]),0)/60000),forceType:'auto',bonus:0,deduct:0,note:''};
 const snap=JSON.parse(JSON.stringify(a));S.shifts.push(sh);S.active=null;save();vib([30,60,30]);renderHome();syncNotif();
 const c=calc(sh);
 if(openEdit){openShiftEdit(sh.id);return}
 toast(T('clockedOut',{h:fmtH(c.min)}),T('undo'),()=>{S.shifts=S.shifts.filter(x=>x.id!==sh.id);S.active=snap;save();renderHome();syncNotif()})}
function togglePause(){const a=S.active;if(!a)return;const now=Date.now();if(a.pausedAt){a.pauses.push([a.pausedAt,now]);a.pausedAt=null}else a.pausedAt=now;save();vib(20);renderHome();syncNotif()}
/* fix start time of the running shift */
function fixStart(){const a=S.active;if(!a)return;
 openModal('<h2>'+esc(T('fixStartQ'))+'</h2><div class="fld"><label for="fsT">'+esc(T('start'))+'<small>'+esc(T('fixStartHint'))+'</small></label><input type="time" id="fsT" value="'+hhmm(a.start)+'"></div><div class="row2" style="margin-top:12px"><button class="btn ghost" id="fsNo">'+esc(T('cancel'))+'</button><button class="btn pri" id="fsOk">'+esc(T('ok'))+'</button></div>',sh=>{
  sh.querySelector('#fsNo').onclick=closeModal;
  sh.querySelector('#fsOk').onclick=()=>{const v=sh.querySelector('#fsT').value;if(!v)return;const now=new Date();const x=hm(v);
   let st=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Math.floor(x/60),x%60).getTime();if(st>now.getTime())st-=DAY_MS;
   a.start=st;a.pauses=a.pauses.filter(p=>p[1]>st).map(p=>[Math.max(p[0],st),p[1]]);if(a.pausedAt&&a.pausedAt<st)a.pausedAt=st;
   save();closeModal();toast(T('startFixed',{t:hhmm(st)}));renderHome();syncNotif()}})}
/* quick shifts (templates) */
function tplShift(tp,dateIso,jobId){const[y,m,d]=dateIso.split('-').map(Number);const a=hm(tp.st),b=hm(tp.en);
 return{id:uid(),jobId,kind:'work',start:new Date(y,m-1,d,Math.floor(a/60),a%60).getTime(),end:new Date(y,m-1,d+(b<=a?1:0),Math.floor(b/60),b%60).getTime(),pauseMin:num(tp.pause),forceType:tp.type||'auto',bonus:0,deduct:0,note:''}}

 let rows='';sm.list.forEach(s=>{const c=calc(s,j);const w=s.kind==='work';rows+='<tr><td>'+esc(fmtDay(s.start,{weekday:'short',day:'numeric',month:'numeric'}))+'</td><td>'+esc(w?T('t_'+c.type):T('k_'+s.kind))+'</td><td>'+(w?hhmm(s.start):'')+'</td><td>'+(w?hhmm(s.end):'')+'</td><td class="n">'+(w?fmtH(c.min):'')+'</td><td class="n">'+esc(money(c.pay))+'</td><td>'+esc(s.note||'')+'</td></tr>'});

 '<table><thead><tr><th>'+esc(T('date'))+'</th><th>'+esc(T('kind'))+'</th><th>'+esc(T('inLbl'))+'</th><th>'+esc(T('outLbl'))+'</th><th class="n">'+esc(T('hours'))+'</th><th class="n">'+esc(T('pay'))+'</th><th>'+esc(T('note'))+'</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7">'+esc(T('noShifts'))+'</td></tr>')+'</tbody></table>'+

 if(actLabel){const b=document.createElement('button');b.textContent=actLabel;b.onclick=()=>{r.innerHTML='';act()};t.appendChild(b)}
 r.appendChild(t);toastTimer=setTimeout(()=>{r.innerHTML=''},actLabel?7000:2800)}

/* ---------- HOME ---------- */
function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arcPath(r,a0,a1){if(a1-a0>=359.9)a1=a0+359.9;const[x0,y0]=polar(160,160,r,a0),[x1,y1]=polar(160,160,r,a1);return'M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)}
function dialSVG(){let s='<circle class="ring" cx="160" cy="160" r="150"/>';
 for(let i=0;i<60;i++){const big=i%5===0;const[x0,y0]=polar(160,160,150,i*6),[x1,y1]=polar(160,160,big?138:144,i*6);s+='<line class="tick'+(big?' big':'')+'" x1="'+x0.toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+x1.toFixed(1)+'" y2="'+y1.toFixed(1)+'" stroke-width="'+(big?2:1)+'"/>'}
 [12,3,6,9].forEach(n=>{const[x,y]=polar(160,160,122,(n%12)*30);s+='<text class="num" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'">'+n+'</text>'});
 s+='<path id="arcB" class="arc b" d=""/><path id="arcO" class="arc o" d=""/><circle id="hand" class="hand" r="6" cx="160" cy="10"/>';return s}
function minToDeg(ms){const d=new Date(ms);return((d.getHours()%12)*60+d.getMinutes()+d.getSeconds()/60)/720*360}
function renderHome(){const j=job(S.cur);const a=S.active;const aj=a?job(a.jobId):j;
 $('#jobChipName').textContent=aj.name;$('#jobDot').style.background=aj.color;
 const dial=$('#dial');if(!dial.firstChild)dial.innerHTML=dialSVG();
 $('#verLbl').textContent='v'+VERSION;
 // banners
 let b='';if(a){const hrs=activeElapsedMs()/3600000;if(hrs>=16)b+='<div class="banner warn"><p>'+esc(T('longShift',{h:Math.floor(hrs)}))+'</p><button class="btn" id="bFix">'+esc(T('fixNow'))+'</button></div>'}
 if(S.shifts.length>5&&Date.now()-(S.lastBackup||0)>14*DAY_MS)b+='<div class="banner"><p>'+esc(T('backupNudge'))+'</p><button class="btn" id="bBk">'+esc(T('exportJson'))+'</button></div>';
 const hb=$('#homeBanner');if(hb.dataset.v!==b){hb.innerHTML=b;hb.dataset.v=b;const f=$('#bFix');if(f)f.onclick=()=>clockOut(true);const k=$('#bBk');if(k)k.onclick=exportJSON}
 tick();
 // buttons
 const bp=$('#btnPunch'),bz=$('#btnPause');
 bp.innerHTML='<svg><use href="#i-'+(a?'out':'in')+'"/></svg><span>'+esc(T(a?'clockOut':'clockIn'))+'</span>';
 bp.classList.toggle('pri',true);
 bz.hidden=!a;if(a)bz.innerHTML='<svg><use href="#i-cup"/></svg><span>'+esc(T(a.pausedAt?'resume':'pause'))+'</span>';
 const bq=$('#btnQuick'),bf=$('#btnFix');bq.hidden=!!a;bq.innerHTML='<svg><use href="#i-bolt"/></svg><span>'+esc(T('quickShifts'))+'</span>';bf.hidden=!a;bf.textContent=T('fixStart');
 updateStats()}
function updateStats(){const a=S.active;const aj=a?job(a.jobId):job(S.cur);
 const now=Date.now();const[y,m,d]=dayParts(now);const t0=new Date(y,m,d).getTime();
 const td=summary(t0,t0+DAY_MS*1.5,aj);let tMin=td.list.filter(s=>s.start<new Date(y,m,d+1).getTime()).reduce((x,s)=>x+calc(s,aj).min,0);
 let tPay=td.list.filter(s=>s.start<new Date(y,m,d+1).getTime()).reduce((x,s)=>x+calc(s,aj).pay,0);
 const pr=periodRange(periodOf(now,aj));const ps=summary(pr.from,pr.to,aj);let pMin=ps.min,pPay=ps.gross;
 if(a){const lc=calc({kind:'work',start:a.start,end:now,pauseMin:activePauseMin(now),forceType:'auto'},aj);if(a.start>=t0){tMin+=lc.min;tPay+=lc.pay}if(a.start>=pr.from){pMin+=lc.min;pPay+=lc.pay}}
 $('#stTodayH').textContent=fmtH(tMin);$('#stTodayP').textContent=money(r2(tPay));
 $('#stPerH').textContent=fmtH(pMin);$('#stPerP').textContent=money(r2(pPay))}
function tick(){const a=S.active,now=Date.now();const aj=a?job(a.jobId):job();
 const hand=$('#hand');if(!hand)return;const[hx,hy]=polar(160,160,150,minToDeg(now));hand.setAttribute('cx',hx.toFixed(1));hand.setAttribute('cy',hy.toFixed(1));
 const lbl=$('#dLbl'),big=$('#dBig'),sub=$('#dSub');
 if(!a){$('#arcB').setAttribute('d','');$('#arcO').setAttribute('d','');lbl.className='dlbl';lbl.textContent=T('offWork');big.textContent=hhmm(now);
  sub.textContent=fmtDay(now,{weekday:'long',day:'numeric',month:'long'});$('#dial').setAttribute('aria-label',T('offWork'));return}
 const el=activeElapsedMs(now);const s=Math.floor(el/1000);big.textContent=Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
 lbl.className='dlbl live';lbl.textContent=a.pausedAt?T('onBreak'):T('atWork',{t:hhmm(a.start)});
 const lc=calc({kind:'work',start:a.start,end:now,pauseMin:activePauseMin(now),forceType:'auto'},aj);
 sub.innerHTML=esc(T('earnedNow',{v:''})).trim()+' <b>'+esc(money(lc.pay))+'</b>';
 // arc: from clock-in position on a 12h face, length = worked time; base part vs overtime part
 const a0=minToDeg(a.start),baseMin=num(aj.types[lc.type].base)*60;const wm=el/60000;
 const bEnd=a0+Math.min(wm,baseMin,720)/720*360;$('#arcB').setAttribute('d',wm>0.5?arcPath(150,a0,Math.max(bEnd,a0+0.5)):'');
 $('#arcO').setAttribute('d',wm>baseMin&&baseMin<720?arcPath(150,bEnd,a0+Math.min(wm,720)/720*360):'');
 $('#dial').setAttribute('aria-label',lbl.textContent)}
let secs=0;setInterval(()=>{if(!$('#s-home').classList.contains('on'))return;secs++;tick();if(S.active&&secs%5===0)updateStats();if(secs%60===0)renderHome()},1000);

 h+='<button class="btn dng" id="bEmpty" style="margin-top:10px">'+esc(T('emptyBin'))+'</button>';L.innerHTML=h;
 L.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{const s=S.shifts.find(x=>x.id===b.dataset.rs);if(s){s.deleted=null;save();toast(T('restored'));renderBin()}});
 L.querySelectorAll('[data-df]').forEach(b=>b.onclick=async()=>{if(await ask(T('deleteForever')+'?',T('del'),true)){S.shifts=S.shifts.filter(x=>x.id!==b.dataset.df);save();renderBin()}});
 $('#bEmpty').onclick=async()=>{if(await ask(T('emptyBinQ'),T('del'),true)){S.shifts=S.shifts.filter(x=>!x.deleted);save();renderBin()}}}

/* ---------- DIAG ---------- */
async function diagData(){let persisted='?';try{persisted=navigator.storage&&navigator.storage.persisted?(await navigator.storage.persisted()):'?'}catch(e){}
 const sw=('serviceWorker' in navigator)&&!!navigator.serviceWorker.controller;
 const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
 let size=0;try{size=(store.get(SKEY)||'').length}catch(e){}
 let errs=[];try{errs=JSON.parse(localStorage.getItem(EKEY)||'[]')}catch(e){}
 return{version:VERSION,standalone,storage:store.ok(),persisted,sw,size,jobs:S.jobs.length,shifts:S.shifts.filter(s=>!s.deleted).length,bin:S.shifts.filter(s=>s.deleted).length,ua:navigator.userAgent,lang:S.lang,errs}}
async function renderDiag(){const d=await diagData();const yn=v=>v===true?T('yes'):v===false?T('no'):String(v);
 let h='<div class="card">'+[['dg_version','v'+d.version],['dg_install',yn(d.standalone)],['dg_storage',d.storage?T('onDevice'):T('memOnly')],['dg_persist',yn(d.persisted)],['dg_sw',yn(d.sw)],
  ['dg_data',d.jobs+' / '+d.shifts+' / '+d.bin+'  ('+Math.round(d.size/1024)+' KB)'],['dg_device',d.ua.replace(/^Mozilla\/5\.0 /,'').slice(0,70)]].map(r=>'<div class="dgrow"><span>'+esc(T(r[0]))+'</span><span>'+esc(r[1])+'</span></div>').join('')+'</div>'+
  '<div class="card"><h2>'+esc(T('errLog'))+'</h2>'+(d.errs.length?'<pre class="diag">'+esc(d.errs.map(e=>e.t+' '+e.s+':'+e.l+' '+e.m).join('\n'))+'</pre>':'<p class="note">'+esc(T('noErrors'))+'</p>')+'</div>'+
  '<button class="btn" id="dCopy">'+esc(T('copyReport'))+'</button>';
 $('#diagBody').innerHTML=h;
 $('#dCopy').onclick=async()=>{const txt='WorkNest diagnostics\n'+JSON.stringify(Object.assign({},d,{}),null,1);try{await navigator.clipboard.writeText(txt);toast(T('copied'))}catch(e){download('worknest-diagnostics.txt',txt,'text/plain')}}}

/* ---------- ABOUT ---------- */
function renderAbout(){const rows=[[T('dg_version'),'v'+VERSION],[T('ab_dev'),'Barak Aflalo'],[T('ab_platform'),'PWA · HTML5'],[T('dg_storage'),T('ab_storageVal')],[T('ab_license'),'© AppNest 2026']];
 $('#aboutBody').innerHTML='<div class="aboutlogo"><img src="icon-192.png" alt=""><b>WorkNest</b><span class="note">'+esc(T('tagline'))+'</span></div><p>'+esc(T('aboutDesc'))+'</p>'+
 '<div class="card">'+rows.map(r=>'<div class="dgrow"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join('')+'</div>'+
 '<div class="card"><a class="linkrow" href="https://barakaflalo.github.io/appnest" target="_blank" rel="noopener"><svg><use href="#i-store"/></svg>'+esc(T('store'))+'</a>'+
 '<button class="linkrow" id="aShare"><svg><use href="#i-share"/></svg>'+esc(T('share'))+'</button>'+
 '<a class="linkrow" href="mailto:appnest55@gmail.com?subject=WorkNest%20v'+VERSION+'"><svg><use href="#i-mail"/></svg>'+esc(T('feedback'))+'</a>'+
 '<button class="linkrow" id="aTour"><svg><use href="#i-flag"/></svg>'+esc(T('tour'))+'</button>'+
 '<a class="linkrow" href="privacy_policy.html" target="_blank" rel="noopener"><svg><use href="#i-lock"/></svg>'+esc(T('privacy'))+'</a></div>'+
 '<p class="disc">'+esc(T('disclaimer'))+'</p>';
 $('#aShare').onclick=async()=>{const url=location.href.split('#')[0];try{if(navigator.share){await navigator.share({title:'WorkNest',text:T('tagline')+(S.user?' — '+S.user:''),url});return}}catch(e){return}try{await navigator.clipboard.writeText(url);toast(T('copied'))}catch(e){}};
 $('#aTour').onclick=()=>onboarding(0)}

/* ---------- onboarding ---------- */
function onboarding(i){const steps=[['ob1t','ob1b'],['ob2t','ob2b'],['ob3t','ob3b'],['ob4t','ob4b'],['ob5t','ob5b']];const last=i===steps.length-1;
 openModal('<div class="ob"><svg><use href="#i-clock"/></svg><h2>'+esc(T(steps[i][0]))+'</h2><p>'+esc(T(steps[i][1]))+'</p>'+
  (i===0?'<div class="fld" style="border:0"><label for="obLang">'+esc(T('language'))+'</label><select id="obLang">'+LANGS.map((l,k)=>'<option value="'+l+'"'+(S.lang===l?' selected':'')+'>'+LANG_NAMES[k]+'</option>').join('')+'</select></div>':'')+
  '<div class="dots">'+steps.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('')+'</div><div class="row2"><button class="btn ghost" id="obSkip">'+esc(T('skip'))+'</button><button class="btn pri" id="obNext">'+esc(T(last?'letsGo':'next'))+'</button></div></div>',sh=>{
  const fin=()=>{S.onboarded=true;save();closeModal()};
  sh.querySelector('#obSkip').onclick=fin;sh.querySelector('#obNext').onclick=()=>{if(last)fin();else onboarding(i+1)};
  const ol=sh.querySelector('#obLang');if(ol)ol.onchange=()=>{S.lang=ol.value;save();rerenderAll();onboarding(0)}})}

/* ---------- NFC ---------- */
function nfcUrl(jid){return location.origin+location.pathname+'?nfc='+encodeURIComponent(jid||S.cur)}
async function writeNfc(){try{const r=new NDEFReader();toast(T('nfcHold'));await r.write({records:[{recordType:'url',data:nfcUrl()}]});toast(T('nfcDone'));vib([30,60,30])}catch(e){logErr('nfc: '+e.name+' '+e.message);toast(T('nfcFail'))}}
function handleNfc(jid){const now=Date.now();if(now-(S.lastNfc||0)<15000){toast(T('nfcBusy'));return}S.lastNfc=now;save();
 if(S.active){clockOut(false);return}
 if(jid&&S.jobs.find(j=>j.id===jid))S.cur=jid;clockIn()}

/* ---------- STATS ---------- */
let statsAll=false;
function shortMoney(n){n=+n||0;return '₪'+(n>=10000?(Math.round(n/100)/10)+'K':Math.round(n).toLocaleString('en-US'))}
function barChart(items,opt){opt=opt||{};const W=340,H=170,top=22,bot=30,n=items.length;if(!n)return'';const max=Math.max(1,...items.map(i=>i.v));const bw=Math.min(40,(W/n)*0.6),gap=W/n;
 let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||'')+'"><line x1="0" x2="'+W+'" y1="'+(H-bot)+'" y2="'+(H-bot)+'"/>';
 const rtl=S.lang==='he'||S.lang==='ar';
 items.forEach((it,i)=>{const idx=rtl?n-1-i:i;const x=idx*gap+(gap-bw)/2;const h=(H-top-bot)*it.v/max;const y=H-bot-h;
  s+='<rect class="bar'+(it.cls?' '+it.cls:'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,it.v>0?2:0).toFixed(1)+'" rx="4"/>'+
   '<text class="v" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+esc(it.t)+'</text><text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(it.l)+'</text>'});
 return s+'</svg>'}
function pct(a,b){if(!b)return'';const p=Math.round((a-b)/b*100);return(p>0?'+':'')+p+'%'}
function renderStats(){const B=$('#statsBody');const j=job();
 let h='<div class="seg" role="group"><button data-sa="0" aria-pressed="'+!statsAll+'">'+esc(T('thisJob'))+'</button><button data-sa="1" aria-pressed="'+statsAll+'">'+esc(T('allJobs'))+'</button></div>';
 const any=S.shifts.some(s=>!s.deleted);
 if(!any){B.innerHTML=h+'<div class="empty"><b>'+esc(T('noData'))+'</b></div>';bindSA();return}
 if(!statsAll){const cur=periodOf(Date.now(),j);const pers=[];for(let k=5;k>=0;k--){const p={y:cur.y,m:cur.m-k,P:cur.P};while(p.m<0){p.m+=12;p.y--}pers.push(p)}
  const sums=pers.map(p=>{const r=periodRange(p);return Object.assign(summary(r.from,r.to,j),{r})});const now=sums[5],prev=sums[4];
  const net=(j.net&&j.net.on&&now.n)?netOf(now.total,now.travel,j).net:null;
  h+='<div class="kpis"><div class="stat"><small>'+esc(T('thisPeriod'))+'</small><div class="v">'+fmtH(now.min)+'</div><div class="v2">'+money(now.total)+'</div>'+(prev.total?'<small class="'+(now.total>=prev.total?'up':'down')+'">'+esc(T('vsPrev',{p:pct(now.total,prev.total)}))+'</small>':'')+'</div>'+
   '<div class="stat"><small>'+esc(T('netEst'))+'</small><div class="v">'+(net!==null?money(net):'—')+'</div></div>'+
   '<div class="stat"><small>'+esc(T('avgShift'))+'</small><div class="v">'+(now.wn?fmtH(now.min/now.wn):'—')+'</div><div class="v2">'+(now.wn?money(r2(now.gross/Math.max(1,now.n))):'')+'</div></div>'+
   '<div class="stat"><small>'+esc(T('effHourly'))+'</small><div class="v">'+(now.min?money(r2(now.gross/(now.min/60))):'—')+'</div><div class="v2">'+esc(T('reports'))+': '+now.n+'</div></div></div>';
  h+='<div class="card"><h2>'+esc(T('lastPeriods'))+'</h2>'+barChart(sums.map((s,i)=>({v:s.total,t:s.total?shortMoney(s.total):'',l:fmtDay(s.r.from+DAY_MS*3,{month:'short'}),cls:i===5?'':'dim'})),{label:T('lastPeriods')})+'</div>';
  const wk=[];const r=now.r;for(let a=r.from,i=1;a<r.to;a=new Date(new Date(a).setDate(new Date(a).getDate()+7)).getTime(),i++){const b=Math.min(r.to,new Date(new Date(a).setDate(new Date(a).getDate()+7)).getTime());const m=now.list.filter(s=>s.start>=a&&s.start<b).reduce((x,s)=>x+calc(s,j).min,0);wk.push({v:m,t:m?fmtH(m):'',l:String(i)})}
  h+='<div class="card"><h2>'+esc(T('weeksChart'))+'</h2>'+barChart(wk,{label:T('weeksChart')})+'</div>';
  const types=['morning','afternoon','night','shabbat'].filter(k=>now.byType[k]);const mx=Math.max(1,...types.map(k=>now.byType[k]));
  if(types.length)h+='<div class="card"><h2>'+esc(T('byType'))+'</h2>'+types.map(k=>'<div class="hbar"><span>'+esc(T('t_'+k))+'</span><i style="width:'+Math.round(now.byType[k]/mx*100)+'%;background:'+typeColor(k)+'"></i><span>'+fmtH(now.byType[k])+'</span></div>').join('')+'</div>';
 }else{const d=new Date();const months=[];for(let k=5;k>=0;k--)months.push({y:d.getFullYear(),m:d.getMonth()-k,P:1});months.forEach(p=>{while(p.m<0){p.m+=12;p.y--}});
  const tot=months.map(p=>{const r=periodRange(p);let g=0,mn=0;S.jobs.forEach(jj=>{const s=summary(r.from,r.to,jj);g+=s.total;mn+=s.min});return{r,g:r2(g),mn}});const now=tot[5];
  h+='<div class="kpis"><div class="stat"><small>'+esc(fmtDay(now.r.from,{month:'long',year:'numeric'}))+'</small><div class="v">'+fmtH(now.mn)+'</div><div class="v2">'+money(now.g)+'</div>'+(tot[4].g?'<small class="'+(now.g>=tot[4].g?'up':'down')+'">'+esc(T('vsPrev',{p:pct(now.g,tot[4].g)}))+'</small>':'')+'</div>'+
   '<div class="stat"><small>'+esc(T('effHourly'))+'</small><div class="v">'+(now.mn?money(r2(now.g/(now.mn/60))):'—')+'</div><div class="v2">'+esc(T('jobs'))+': '+S.jobs.length+'</div></div></div>';
  h+='<div class="card"><h2>'+esc(T('lastMonths'))+'</h2>'+barChart(tot.map((s,i)=>({v:s.g,t:s.g?shortMoney(s.g):'',l:fmtDay(s.r.from,{month:'short'}),cls:i===5?'':'dim'})),{label:T('lastMonths')})+'</div>';
  h+='<div class="card"><h2>'+esc(T('perJob'))+'</h2>'+S.jobs.map(jj=>{const s=summary(now.r.from,now.r.to,jj);const nt=(jj.net&&jj.net.on&&s.n)?netOf(s.total,s.travel,jj).net:null;
   return'<div class="jobrow"><span class="dot" style="background:'+esc(jj.color)+'"></span><span class="n">'+esc(jj.name)+'<small style="display:block;color:var(--mut);font-weight:400">'+fmtH(s.min)+(nt!==null?' · '+esc(T('netEst'))+' '+money(nt):'')+'</small></span><b>'+money(s.total)+'</b></div>'}).join('')+'<p class="note">'+esc(T('allJobsNote'))+'</p></div>'}
 B.innerHTML=h;bindSA()}
function bindSA(){$('#statsBody').querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>{statsAll=b.dataset.sa==='1';renderStats()})}

/* ---------- wiring ---------- */
function bindGo(root){root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function init(){load();applyLook();applyLang();bindGo(document);
 document.querySelectorAll('[data-back]').forEach(b=>b.onclick=goBack);
 $('#btnPunch').onclick=()=>S.active?clockOut(false):clockIn();
 $('#btnPause').onclick=togglePause;$('#jobChip').onclick=pickJob;$('#btnMode').onclick=()=>{S.mode=S.mode==='day'?'night':'day';save();applyLook()};$('#btnAbout').onclick=()=>go('about');
 $('#btnNewJob').onclick=addJob;$('#btnQuick').onclick=quickSheet;$('#btnFix').onclick=fixStart;$('#btnPdf').onclick=printReport;
 $('#pPrev').onclick=()=>{viewP.m--;if(viewP.m<0){viewP.m=11;viewP.y--}renderShifts()};
 $('#pNext').onclick=()=>{viewP.m++;if(viewP.m>11){viewP.m=0;viewP.y++}renderShifts()};
 let nfcJob=null;try{const q=new URLSearchParams(location.search);if(q.has('nfc'))nfcJob=q.get('nfc')||'';history.replaceState({s:'home'},'',location.pathname)}catch(e){}
 if(location.protocol==='file:')$('#fileWarn').innerHTML='<div class="banner warn" style="margin:10px 16px"><p style="margin:0">'+esc(T('fileWarn'))+'</p></div>';
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderHome()});
 renderHome();save();syncNotif();
 if(nfcJob!==null)setTimeout(()=>handleNfc(nfcJob),300);
 if(!S.onboarded)onboarding(0);
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(e=>logErr('sw: '+e.message))}
init();
</script>
